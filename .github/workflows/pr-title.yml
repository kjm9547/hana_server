name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: 커밋 메시지 형식 검사 (Squash 머지 시 main 커밋이 됨)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|perf|test|docs|chore|ci)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR 제목이 컨벤션에 맞지 않습니다: '$TITLE'"
            echo "형식: <type>(<scope>): <요약>  예) feat(chat): 1:1 대화방 생성 API 추가"
            echo "type: feat | fix | refactor | perf | test | docs | chore | ci  (CONTRIBUTING.md 참고)"
            exit 1
          fi
